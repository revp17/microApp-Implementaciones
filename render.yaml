services:
  - type: web
    name: implementaciones-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: NHOST_SUBDOMAIN
        sync: false
      - key: NHOST_REGION
        sync: false
      - key: NHOST_ADMIN_SECRET
        sync: false
      - key: NHOST_JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
  - type: web
    name: implementaciones-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
